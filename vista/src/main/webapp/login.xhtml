<?xml version='1.0' encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/plantilla/plantilla.xhtml">

    <ui:define name="titulo"> Consulta de administradores </ui:define>
    <ui:define name="subtitulo"> Consulta de administradores </ui:define>

    <ui:define name="contenido">
        <div class="contenedor">
            <h:form id="formAdmin">

                <p:messages id="messages" showDetail="true" closable="true">

                </p:messages>

                <div class="busqueda">
                    <h:inputText styleClass="busq" value="#{adminBean.filtroBusqueda}" placeholder="Buscar..."/>
                    <h:commandButton value="Buscar" styleClass="btnRegistrar" action="#{adminBean.buscar()}" />
                </div>

                <h:panelGroup id="boxEdicion" rendered="#{adminBean.adminSeleccionado != null}" layout="block" styleClass="box-modificar">
                    <h3>Modificar un administrador</h3>

                    <h:panelGrid columns="2">
                        <h:outputLabel value="Nombre:"/>
                        <h:inputText maxlength="50" autocomplete="false" required="true" value="#{adminBean.adminSeleccionado.nombre}"/>

                        <h:outputLabel value="Apellido paterno:"/>
                        <h:inputText maxlength="50" autocomplete="false" required="true" value="#{adminBean.adminSeleccionado.appaterno}"/>

                        <h:outputLabel value="Apellido materno:"/>
                        <h:inputText maxlength="50" autocomplete="false" required="true" value="#{adminBean.adminSeleccionado.apmaterno}"/>

                        <h:outputLabel value="Usuario:"/>
                        <h:inputText maxlength="45" autocomplete="false" required="true" value="#{adminBean.adminSeleccionado.usuario}"/>

                        <h:outputLabel value="Contrasena:"/>
                        <h:inputText maxlength="45" autocomplete="false" required="true" value="#{adminBean.adminSeleccionado.contrasena}"/>
                    </h:panelGrid>


                    <br/>
                    <h:commandButton value="Guardar cambios" action="#{adminBean.guardarEdicion()}" />
                    <h:commandButton value="Cancelar" immediate="true" action="#{adminBean.cancelarEdicion()}" style="margin-left: 10px;" />
                </h:panelGroup>

                <h:dataTable value="#{adminBean.listaAdmin}" var="admin" styleClass="tabla">
                    <h:column>
                        <f:facet name="header">Nombre completo</f:facet>
                        <h:outputText value="#{admin.nombre} #{admin.appaterno} #{admin.apmaterno}"/>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Usuario</f:facet>
                        <h:outputText value="#{admin.usuario}"/>
                    </h:column>

                    <h:column>
                        <f:facet name="header"></f:facet>
                        <div class="acciones">
                            <h:commandLink action="#{adminBean.setAdminSeleccionado(admin)}" styleClass="btn-icono">
                                <h:graphicImage url="resources/edit-icon.png"/>
                            </h:commandLink>
                            <h:commandLink action="#{adminBean.elim(admin)}" onclick="return confirm('Seguro de eliminarlo?');" styleClass="btn-icono">
                                <h:graphicImage url="resources/elimin-icon.png"/>
                            </h:commandLink>
                        </div>
                    </h:column>
                </h:dataTable>

            </h:form>
        </div>
    </ui:define>
</ui:composition>
