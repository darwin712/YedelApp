<?xml version='1.0' encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/plantilla/plantilla.xhtml">

    <ui:define name="titulo">Calendario</ui:define>
    <ui:define name="subtitulo">Calendario</ui:define>

    <f:metadata>
        <f:viewAction action="#{loginUI.verificarCliente()}"/>
    </f:metadata>

    <ui:define name="contenido">
        <style>
            .calendario {
                width: 100%;
                margin: 0;
                min-height: auto;
            }

            .barraCalendario {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 15px;
                margin-bottom: 14px;
            }

            .encabezadoCalendario {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 15px;
                margin-bottom: 16px;
            }

            .encabezadoCalendario .btnAgregar {
                margin: 0;
            }

            .encabezadoCalendario .fieldSelect {
                margin: 0;
                flex: 0 0 auto;
                width: auto;
            }

            .tituloCalendario {
                font-size: 27px;
                font-weight: bold;
                margin: 0 0 0 10px;
                background: #D6249F;
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .controlesEncabezado {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-wrap: wrap;
            }

            .controlesCalendario {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-wrap: wrap;
            }

            .calendario .controlesCalendario .ui-button {
                --relleno: #FFFFFF;
                --relleno-h: #FDF2F9;
                --borde: #E4D9EC;
                --texto: #78155b;
                --anillo: linear-gradient(90deg, #D6249F, #B58CFF, #8FE9E5);
                border: 2px solid transparent;
                background: linear-gradient(var(--relleno), var(--relleno)) padding-box,
                linear-gradient(var(--borde), var(--borde)) border-box;
                color: var(--texto);
                font-family: inherit;
                font-weight: bold;
                font-size: 14px;
                padding: 3px 12px;
                border-radius: 16px;
                box-shadow: none;
                cursor: pointer;
                transition: transform 0.15s, box-shadow 0.2s;
            }

            .calendario .controlesCalendario .ui-button .ui-button-text {
                color: inherit;
            }

            .calendario .controlesCalendario .ui-button:enabled:hover {
                background: linear-gradient(var(--relleno-h), var(--relleno-h)) padding-box,
                var(--anillo) border-box;
                color: var(--texto);
                transform: scale(1.05);
                box-shadow: 0 8px 20px rgba(214, 36, 159, 0.22);
            }

            .calendario .controlesCalendario .ui-button:enabled:focus {
                box-shadow: none;
            }

            .calendario .controlesCalendario .ui-button:focus-visible {
                outline: 3px solid #F5A3D6;
                outline-offset: 3px;
            }

            .calendario .controlesCalendario .ui-button.vistaActiva {
                --relleno: #D6249F;
                --relleno-h: #B81B88;
                --borde: #D6249F;
                --texto: #FFFFFF;
            }

            .calendario .controlesCalendario .ui-button.btnHoy {
                --relleno: #25ccc9;
                --relleno-h: #23c1be;
                --borde: #25ccc9;
                --texto: #FFFFFF;
                --anillo: linear-gradient(90deg, #8FE9E5, #B58CFF, #F5A3D6);
            }

            .vistaMes,
            .vistaHoras {
                border: 2px solid #E4D9EC;
                border-radius: 14px;
                overflow: hidden;
            }

            .diasSemana {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                background: #f0b8da;
            }

            .diasSemana div {
                text-align: center;
                padding: 12px 5px;
                font-size: 14px;
                font-weight: bold;
                color: #6d1753;
            }

            .cuadriculaCalendario {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                grid-auto-rows: minmax(115px, auto);
                margin-bottom: -1px;
            }

            .diaCalendario {
                border-right: 1px solid #e4d9ec98;
                border-bottom: 1px solid #e4d9ec98;
                padding: 8px;
                min-width: 0;
                box-sizing: border-box;
            }

            .diaCalendario.diaSabado {
                border-right: none;
            }

            .numeroDia {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 28px;
                height: 28px;
                border-radius: 50%;
                font-size: 13px;
                color: #78155b;
                margin-bottom: 6px;
            }

            .diaActual .numeroDia {
                background: #D6249F;
                color: #FFFFFF;
                font-weight: bold;
            }

            .encabezadoHoras,
            .cuerpoHoras {
                display: grid;
            }

            .encabezadoHoras {
                background: #f0b8da;
            }

            .encabezadoDiaHoras {
                padding: 8px 10px;
                border-left: 1px solid #e4d9ec98;
                min-width: 0;
            }

            .encabezadoDiaHoras .dia {
                display: block;
                font-size: 11px;
                font-weight: bold;
                color: #6d1753;
                text-transform: capitalize;
            }

            .encabezadoDiaHoras .numero {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 34px;
                height: 34px;
                border-radius: 50%;
                font-size: 20px;
                color: #6d1753;
            }

            .encabezadoDiaHoras.hoy .numero {
                background: #D6249F;
                color: #FFFFFF;
            }

            .etiquetaHora {
                height: 60px;
                box-sizing: border-box;
                padding: 2px 8px 0 0;
                text-align: right;
                font-size: 12px;
                color: #6d1753;
            }

            .columnaDia {
                position: relative;
                border-left: 1px solid #e4d9ec98;
                min-width: 0;
                background-color: #FFFFFF;
                background-image: repeating-linear-gradient(to bottom, #e4d9ec98 0, #e4d9ec98 1px, transparent 1px, transparent 60px);
            }

            .columnaDia.finSemana {
                background-color: #F5F0F8;
            }

            .columnaDia.hoy {
                background-color: #FDF2F9;
            }

            .evento {
                --h: 320;
                --fondo: hsl(var(--h), 70%, 92%);
                --borde: hsl(var(--h), 65%, 45%);
                --texto: hsl(var(--h), 60%, 25%);
                border: 2px solid transparent;
                border-radius: 10px;
                background: linear-gradient(var(--fondo), var(--fondo)) padding-box,
                linear-gradient(var(--borde), var(--borde)) border-box;
                color: var(--texto);
                padding: 4px 8px;
                margin-bottom: 5px;
                font-size: 11px;
                line-height: 1.4;
                overflow-wrap: break-word;
                cursor: pointer;
                transition: transform 0.15s, box-shadow 0.2s;
            }

            .evento:hover {
                background: linear-gradient(var(--fondo), var(--fondo)) padding-box,
                linear-gradient(90deg, #D6249F, #B58CFF, #8FE9E5) border-box;
                transform: scale(1.03);
                box-shadow: 0 6px 18px rgba(214, 36, 159, 0.16);
            }

            .evento strong {
                display: block;
                font-size: 11px;
            }

            .columnaDia .evento {
                position: absolute;
                box-sizing: border-box;
                overflow: hidden;
                margin: 0;
                box-shadow: 0 0 0 1px #FFFFFF;
            }

            .columnaDia .evento:hover {
                z-index: 2;
                box-shadow: 0 6px 18px rgba(214, 36, 159, 0.16);
            }

            .enlaceCita {
                display: block;
                height: 100%;
                color: inherit;
                text-decoration: none;
            }

            .btnRegistrar.btnEliminar {
                --relleno: #E0457B;
                --relleno-h: #C93468;
                --borde: #E0457B;
            }

            .horarioHora{
                display: flex !important;
                width: 100% !important;
                min-width: 0;
            }

            .horarioHora .ui-inputfield{
                width: calc(100% - 38px) !important;
                min-width: 0;
                border-radius: 10px 0 0 10px !important;
            }

            .horarioHora .ui-datepicker-trigger{
                width: 38px !important;
                min-width: 38px !important;
                margin: 0 !important;
                border-color: #D6249F !important;
                border-radius: 0 10px 10px 0 !important;
                background: #D6249F !important;
                color: #FFFFFF !important;
            }

            .horarioHora .ui-inputfield{
                border-color: #E4D9EC !important;
                color: #78155b;
            }

            .horarioHora .ui-inputfield:enabled:hover,
            .horarioHora .ui-inputfield:enabled:focus{
                border-color: #D6249F !important;
                box-shadow: 0 0 0 1px rgba(214, 36, 159, 0.18) !important;
            }

            .ui-datepicker,
            .p-datepicker.p-component:not(.ui-calendar),
            .ui-selectcheckboxmenu-panel,
            .ui-selectonemenu-panel{
                z-index: 3000 !important;
            }

            .horarioFila{
                display: grid;
                grid-template-columns: 200px minmax(0, 1fr);
                align-items: center;
                gap: 6px;
                padding: 12px;
                border-radius: 12px;
                background-color: #FDF2F9;
            }

            .horarioDia{
                color: #78155b;
                font-weight: bold;
            }

            .ui-selectcheckboxmenu.custom-select{
                display: flex;
                align-items: center;
                width: 100%;
                height: 46px;
                box-sizing: border-box;
                border: 3px solid transparent;
                border-radius: 14px;
                background: linear-gradient(white, white) padding-box,
                linear-gradient(#E4D9EC, #E4D9EC) border-box;
                box-shadow: none;
                transition: box-shadow 0.2s;
            }
            .ui-selectcheckboxmenu.custom-select .ui-selectcheckboxmenu-label-container{
                flex: 1;
                background: transparent;
                border: 0;
            }
            .ui-selectcheckboxmenu.custom-select .ui-selectcheckboxmenu-label{
                padding: 0 16px;
                background: transparent;
                color: #78155b;
                font-family: Arial, sans-serif;
                font-size: 14px;
                font-weight: normal;
            }
            .ui-selectcheckboxmenu.custom-select .ui-selectcheckboxmenu-trigger{
                background: transparent;
                border: 0;
                box-shadow: none;
                color: #D6249F;
            }
            .ui-selectcheckboxmenu.custom-select:not(.ui-state-disabled):hover,
            .ui-selectcheckboxmenu.custom-select.ui-state-focus{
                background: linear-gradient(white, white) padding-box,
                linear-gradient(90deg, #D6249F, #B58CFF, #8FE9E5) border-box;
                box-shadow: 0 6px 18px rgba(214, 36, 159, 0.16);
            }

            .custom-select-panel{
                border: 2px solid #E4D9EC;
                border-radius: 14px;
                background: #FFFFFF;
                box-shadow: 0 8px 24px rgba(120, 21, 91, 0.15);
                overflow: hidden;
                z-index: 3000;
            }
            .custom-select-panel .ui-selectcheckboxmenu-header{
                background: #FDF2F9;
                border: 0;
                border-bottom: 1px solid #E4D9EC;
            }
            .custom-select-panel .ui-selectcheckboxmenu-filter-container .ui-inputfield{
                border: 2px solid #E4D9EC;
                border-radius: 10px;
                background: #FFFFFF;
                color: #78155b;
                box-shadow: none;
            }
            .custom-select-panel .ui-selectcheckboxmenu-filter-container .ui-inputfield:focus{
                border-color: #D6249F;
            }
            .custom-select-panel .ui-selectcheckboxmenu-close{
                color: #D6249F;
            }
            .custom-select-panel .ui-selectcheckboxmenu-items-wrapper{
                background: #FFFFFF;
            }
            .custom-select-panel .ui-selectcheckboxmenu-item{
                color: #78155b;
                font-family: inherit;
                background: white;
                border: 0;
                text-shadow: non;
            }
            .custom-select-panel .ui-selectcheckboxmenu-item:hover{
                background: #FDF2F9;
            }

            .custom-select-panel .ui-chkbox-box{
                display: grid;
                place-items: center;
                width: 22px;
                height: 22px;
                box-sizing: border-box;
                border: 3px solid #E4D9EC;
                border-radius: 7px;
                background: #FFFFFF;
                background-image: none;
                box-shadow: none;
            }

            .custom-select-panel .ui-chkbox-box .ui-chkbox-icon{
                display: none;
            }

            .custom-select-panel .ui-chkbox-box.ui-state-active{
                background: #D6249F;
                border-color: #D6249F;
            }

            .custom-select-panel .ui-chkbox-box.ui-state-active::after{
                content: "";
                width: 5px;
                height: 10px;
                border: solid #FFFFFF;
                border-width: 0 2px 2px 0;
                transform: rotate(45deg) translate(-1px, -1px);
            }

            .custom-select-panel .ui-chkbox-icon{
                color: #FFFFFF;
            }

            .diaCalendario.diaPasado .evento,
            .columnaDia.pasado .evento {
                opacity: 0.45;
                filter: brightness(0.88);
                transition: opacity 0.2s, filter 0.2s;
            }

            .diaCalendario.diaPasado .evento:hover,
            .columnaDia.pasado .evento:hover {
                opacity: 0.5;
                filter: brightness(0.88);
            }

            @media (max-width: 768px) {
                .calendario {
                    overflow-x: auto;
                }

                .encabezadoCalendario,
                .barraCalendario {
                    align-items: stretch;
                    flex-direction: column;
                }

                .controlesEncabezado,
                .controlesCalendario {
                    width: 100%;
                }

                .controlesEncabezado .ui-button,
                .controlesEncabezado .fieldSelect {
                    width: 100%;
                }

                .tituloCalendario {
                    font-size: 18px;
                }

                .vistaMes,
                .vistaHoras {
                    min-width: 560px;
                }

                .cuadriculaCalendario {
                    grid-auto-rows: minmax(100px, auto);
                }

                .fondoFormulario .ui-datepicker,
                .fondoFormulario .ui-inputfield,
                .fondoFormulario .ui-selectonemenu,
                .fondoFormulario .ui-selectcheckboxmenu {
                    width: 100%;
                    max-width: 100%;
                }
            }
        </style>
        <h:form id="formCalendario">
            <h:panelGroup id="calendario" layout="block" styleClass="contenedor calendario">
                <div class="encabezadoCalendario">
                    <h2 class="tituloCalendario">#{gestionCitasBean.titulo}</h2>

                    <div class="controlesEncabezado">
                        <h:selectOneMenu value="#{gestionCitasBean.estilistaSeleccionado}" styleClass="fieldSelect">
                            <f:selectItem itemLabel="Todas las citas" itemValue="0" />
                            <f:selectItems value="#{gestionCitasBean.opcionesEstilistas}" />
                            <f:ajax event="change" listener="#{gestionCitasBean.filtrarPorEstilista}" render="calendario" />
                        </h:selectOneMenu>
                    </div>
                </div>

                <div class="barraCalendario">
                    <div class="controlesCalendario">
                        <p:commandButton value="‹" action="#{gestionCitasBean.anterior}" update="calendario" process="@this" />
                        <p:commandButton value="Hoy" action="#{gestionCitasBean.hoy}" styleClass="btnHoy" update="calendario" process="@this" />
                        <p:commandButton value="›" action="#{gestionCitasBean.siguiente}" update="calendario" process="@this" />
                    </div>

                    <div class="controlesCalendario">
                        <p:commandButton value="Mes" action="#{gestionCitasBean.cambiarVista('MES')}" styleClass="#{gestionCitasBean.vista == 'MES' ? 'vistaActiva' : ''}" update="calendario" process="@this" />
                        <p:commandButton value="Semana" action="#{gestionCitasBean.cambiarVista('SEMANA')}" styleClass="#{gestionCitasBean.vista == 'SEMANA' ? 'vistaActiva' : ''}" update="calendario" process="@this" />
                        <p:commandButton value="3 días" action="#{gestionCitasBean.cambiarVista('TRES_DIAS')}" styleClass="#{gestionCitasBean.vista == 'TRES_DIAS' ? 'vistaActiva' : ''}" update="calendario" process="@this" />
                        <p:commandButton value="Día" action="#{gestionCitasBean.cambiarVista('DIA')}" styleClass="#{gestionCitasBean.vista == 'DIA' ? 'vistaActiva' : ''}" update="calendario" process="@this" />
                    </div>
                </div>

                <ui:fragment rendered="#{gestionCitasBean.vistaMes}">
                    <div class="vistaMes">
                        <div class="diasSemana">
                            <div>Dom</div>
                            <div>Lun</div>
                            <div>Mar</div>
                            <div>Mié</div>
                            <div>Jue</div>
                            <div>Vie</div>
                            <div>Sáb</div>
                        </div>

                        <div class="cuadriculaCalendario">
                            <ui:repeat value="#{gestionCitasBean.dias}" var="dia">
                                <div class="diaCalendario #{dia.sabado ? 'diaSabado' : ''} #{dia.hoy ? 'diaActual' : ''} #{dia.pasado ? 'diaPasado' : ''}" aria-disabled="#{dia.pasado}" style="#{dia.estiloMes}">
                                    <span class="numeroDia">#{dia.fecha.dayOfMonth}</span>

                                    <ui:repeat value="#{dia.citas}" var="cita">
                                        <div class="evento" style="#{cita.estiloColor}">
                                            <strong>
                                                <h:outputText value="#{cita.inicio}">
                                                    <f:convertDateTime type="localDateTime" pattern="h:mm a" locale="en" />
                                                </h:outputText>
                                            </strong>
                                            Ocupado
                                        </div>
                                    </ui:repeat>
                                </div>
                            </ui:repeat></div></div>
                </ui:fragment>
                <ui:fragment rendered="#{!gestionCitasBean.vistaMes}">
                    <div class="vistaHoras">
                        <div class="encabezadoHoras" style="grid-template-columns: 60px repeat(#{gestionCitasBean.dias.size()}, 1fr);">
                            <div></div>

                            <ui:repeat value="#{gestionCitasBean.dias}" var="col">
                                <div class="encabezadoDiaHoras #{col.hoy ? 'hoy' : ''} #{col.pasado ? 'pasado' : ''}">
                                    <span class="dia">#{col.nombreDia}</span>
                                    <span class="numero">#{col.fecha.dayOfMonth}</span>
                                </div>
                            </ui:repeat>

                        </div>

                        <div class="cuerpoHoras" style="grid-template-columns: 60px repeat(#{gestionCitasBean.dias.size()}, 1fr);">
                            <div>
                                <ui:repeat value="#{gestionCitasBean.horas}" var="hora">
                                    <div class="etiquetaHora">
                                        <h:outputText value="#{hora}">
                                            <f:convertDateTime type="localTime" pattern="h a" locale="en" />
                                        </h:outputText>
                                    </div>
                                </ui:repeat>
                            </div >

                            <ui:repeat value="#{gestionCitasBean.dias}" var="col">
                                <div class="columnaDia #{col.finDeSemana ? 'finSemana' : ''} #{col.hoy ? 'hoy' : ''} #{col.pasado ? 'pasado' : ''}" aria-disabled="#{col.pasado}" style="height: #{gestionCitasBean.alturaPixeles}px;">
                                    <ui:repeat value="#{col.citas}" var="cita">
                                        <div class="evento" style="#{cita.estiloPosicion}#{cita.estiloColor}">
                                            <strong>
                                                <h:outputText value="#{cita.inicio}">
                                                    <f:convertDateTime type="localDateTime" pattern="h:mm a" locale="en" />
                                                </h:outputText>
                                                -
                                                <h:outputText value="#{cita.fin}">
                                                    <f:convertDateTime type="localDateTime" pattern="h:mm a" locale="en" />
                                                </h:outputText>
                                            </strong>
                                            <br />
                                            Ocupado
                                        </div>
                                    </ui:repeat>
                                </div>
                            </ui:repeat>
                        </div>

                    </div>
                </ui:fragment>
            </h:panelGroup>
        </h:form>
    </ui:define>
</ui:composition>
