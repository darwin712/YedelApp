<?xml version='1.0' encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/plantilla/plantilla.xhtml">

    <f:metadata>
        <f:viewAction action="#{adminBean.verificarAcceso()}"/>
    </f:metadata>

    <ui:define name="titulo"> Consulta de administradores </ui:define>
    <ui:define name="subtitulo"> Consulta de administradores </ui:define>

    <ui:define name="contenido">
        <div class="contenedor">
            <h:form id="formAdmin">

                <p:messages id="messages" showDetail="true" closable="true">
                    <p:autoUpdate/>
                </p:messages>

                <div class="busqueda">
                    <h:inputText styleClass="busq" value="#{adminBean.filtroBusqueda}" placeholder="Buscar..."/>
                    <h:commandButton image = "resources/busqueda-icon.png" styleClass="btnRegistrar" action="#{adminBean.buscar()}" />
                </div>

                <h:panelGroup id="boxEdicion" rendered="#{adminBean.adminSeleccionado != null}" layout="block" styleClass="fondoFormulario abierto">
                    <div class="contenedor">
                        <div class="datos">
                            <h3>Modificar un administrador</h3>

                            <div class="campo">
                                <h:outputLabel value="Nombre"/>
                                <h:inputText styleClass="fieldLarge" maxlength="50" autocomplete="false" required="true" value="#{adminBean.adminSeleccionado.nombre}"/>
                            </div>

                            <div class="filaDoble">
                                <div class="campo">
                                    <h:outputLabel value="Apellido paterno"/>
                                    <h:inputText styleClass="fieldSmall" maxlength="50" autocomplete="false" required="true" value="#{adminBean.adminSeleccionado.apellidoP}"/>
                                </div>

                                <div class="campo">
                                    <h:outputLabel value="Apellido materno"/>
                                    <h:inputText styleClass="fieldSmall" maxlength="50" autocomplete="false" required="true" value="#{adminBean.adminSeleccionado.apellidoM}"/>
                                </div>
                            </div>

                            <div class="filaDoble">
                                <div class="campo">
                                    <h:outputLabel value="Correo"/>
                                    <h:inputText styleClass="fieldSmall" maxlength="150" autocomplete="false" required="true" value="#{adminBean.adminSeleccionado.correo}"/>
                                </div>

                                <div class="campo">
                                    <h:outputLabel value="Contrasena"/>
                                    <h:inputText styleClass="fieldSmall" maxlength="45" autocomplete="false" required="true" value="#{adminBean.adminSeleccionado.contrasena}"/>
                                </div>
                            </div>

                            <div class="acciones">
                                <h:commandLink action="#{adminBean.guardarEdicion()}" styleClass="btn-icono">
                                    <h:graphicImage url="resources/confirmar-icon.png"/>
                                </h:commandLink>
                                <h:commandLink immediate="true" action="#{adminBean.cancelarEdicion()}" styleClass="btn-icono">
                                    <h:graphicImage url="resources/cancelar-icon.png"/>
                                </h:commandLink>
                            </div>
                        </div>
                    </div>
                </h:panelGroup>

                <h:dataTable value="#{adminBean.listaAdmin}" var="admin" styleClass="tabla">
                    <h:column>
                        <f:facet name="header">Nombre completo</f:facet>
                        <h:outputText value="#{admin.nombre} #{admin.apellidoP} #{admin.apellidoM}"/>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Correo</f:facet>
                        <h:outputText value="#{admin.correo}"/>
                    </h:column>

                    <h:column>
                        <f:facet name="header"></f:facet>
                        <div class="acciones">
                            <h:commandLink action="#{adminBean.setAdminSeleccionado(admin)}" styleClass="btn-icono">
                                <h:graphicImage url="resources/edit-icon.png"/>
                            </h:commandLink>
                            <h:commandLink action="#{adminBean.elim(admin)}" onclick="return confirm('Seguro de eliminarlo?');" styleClass="btn-icono">
                                <h:graphicImage url="resources/elimin-icon.png"/>
                            </h:commandLink>
                        </div>
                    </h:column>
                </h:dataTable>


            </h:form>
        </div>
    </ui:define>
</ui:composition>
