<?xml version='1.0' encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/plantilla/plantilla.xhtml">

    <f:metadata>
        <f:viewAction action="#{adminBean.verificarAcceso()}"/>
    </f:metadata>

    <ui:define name="titulo"> Consulta de administradores </ui:define>
    <ui:define name="subtitulo"> Consulta de administradores </ui:define>

    <ui:define name="contenido">
        <div class="contenedor">
            <h:form id="formAdmin">

                <p:messages id="messages" showDetail="true" closable="true">
                    <p:autoUpdate/>
                </p:messages>

                <div class="busqueda">
                    <h:inputText styleClass="busq" value="#{adminBean.filtroBusqueda}" placeholder="Buscar..."/>
                    <h:commandButton image = "resources/busqueda-icon.png" styleClass="btnRegistrar" action="#{adminBean.buscar()}" />
                </div>

                <h:dataTable value="#{adminBean.listaAdmin}" var="admin" styleClass="tabla">
                    <h:column>
                        <f:facet name="header">Nombre completo</f:facet>
                        <h:outputText value="#{admin.nombre} #{admin.apellidoP} #{admin.apellidoM}"/>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Correo</f:facet>
                        <h:outputText value="#{admin.correo}"/>
                    </h:column>

                    <h:column>
                        <f:facet name="header"></f:facet>
                        <div class="acciones">
                            <p:commandLink styleClass="btn-icono" action="#{adminBean.setAdminSeleccionado(admin)}" update=":formEdicion:panelEdicion" process="@this" oncomplete="abrirFormulario('formEdicion')">
                                <h:graphicImage url="resources/edit-icon.png"/>
                            </p:commandLink>
                            <h:commandLink action="#{adminBean.elim(admin)}" onclick="return confirm('Seguro de eliminarlo?');" styleClass="btn-icono">
                                <h:graphicImage url="resources/elimin-icon.png"/>
                            </h:commandLink>
                        </div>
                    </h:column>
                </h:dataTable>
            </h:form>
        </div>

        <div class="fondoFormulario" id="fondoFormulario" onclick="cerrarFormulario()">
            <div class="contenedor" onclick="event.stopPropagation()">
                <h:form id="formEdicion" styleClass="panelFormulario">
                    <h:panelGroup id="panelEdicion" layout="block">
                        <h:panelGroup layout="block" rendered="#{adminBean.adminSeleccionado != null}">
                            <h2 class="h2aqua">Modificar administrador</h2>
                            <div class="datos">
                                <div class="campo aqua">
                                    <h:outputLabel for="nombreAdmin" value="Nombre"/>
                                    <h:inputText id="nombreAdmin" styleClass="fieldLarge" maxlength="50" autocomplete="off" required="true" value="#{adminBean.adminSeleccionado.nombre}"/>
                                </div>

                                <div class="filaDoble">
                                    <div class="campo aqua">
                                        <h:outputLabel for="apellidoPAdmin" value="Apellido paterno"/>
                                        <h:inputText id="apellidoPAdmin" styleClass="fieldSmall" maxlength="50" autocomplete="off" required="true" value="#{adminBean.adminSeleccionado.apellidoP}"/>
                                    </div>
                                    <div class="campo aqua">
                                        <h:outputLabel for="apellidoMAdmin" value="Apellido materno"/>
                                        <h:inputText id="apellidoMAdmin" styleClass="fieldSmall" maxlength="50" autocomplete="off" required="true" value="#{adminBean.adminSeleccionado.apellidoM}"/>
                                    </div>
                                </div>

                                <div class="filaDoble">
                                    <div class="campo aqua">
                                        <h:outputLabel for="correoAdmin" value="Correo"/>
                                        <h:inputText id="correoAdmin" styleClass="fieldSmall" maxlength="150" autocomplete="off" required="true" value="#{adminBean.adminSeleccionado.correo}"/>
                                    </div>
                                    <div class="campo aqua">
                                        <h:outputLabel for="contrasenaAdmin" value="Contraseña"/>
                                        <h:inputText id="contrasenaAdmin" styleClass="fieldSmall" maxlength="45" autocomplete="off" required="true" value="#{adminBean.adminSeleccionado.contrasena}"/>
                                    </div>
                                </div>

                                <div class="filaBotones">
                                    <p:commandButton value="Guardar cambios" styleClass="btnRegistrar" action="#{adminBean.guardarEdicion()}" update=":formAdmin" oncomplete="if (args &amp;&amp; !args.validationFailed) { cerrarFormulario(); }"/>
                                    <p:commandButton value="Cancelar" styleClass="btnRegistrar" action="#{adminBean.cancelarEdicion()}" process="@this" immediate="true" update=":formAdmin" oncomplete="cerrarFormulario()"/>
                                </div>
                            </div>
                        </h:panelGroup>
                    </h:panelGroup>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
