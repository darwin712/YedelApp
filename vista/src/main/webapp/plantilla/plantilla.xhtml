<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0"> </meta>
    <title>  <ui:insert name="titulo"> YedelApp </ui:insert> </title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #78155b;
            background-color: #F5F0F8;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 78px;
            padding: 0 28px;
            border-bottom: 2px solid #E4D9EC;
            background-color: white;
        }

        .parteIzquierda {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: bold;
            color: #961570;
        }

        .btnSidebar {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: 2px solid #D6249F;
            color: #D6249F;
            background-color: white;
            font-size: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btnSidebar:hover {
            background-color: #f7f2f5;
        }

        .usuario {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 15px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #D6249F;
            color: white;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .textos {
            display: flex;
            flex-direction: column;
        }

        .titulo {
            font-size: 22px;
            font-weight: bold;
            line-height: 1.1;
            background: -webkit-linear-gradient(90deg, #D6249F, #f179cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitulo {
            font-size: 14px;
        }

        .parteDerecha {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .reloj {
            text-align: right;
            line-height: 1.2;
        }

        .hora {
            font-size: 18px;
            font-weight: bold;
        }

        .fecha {
            font-size: 12px;
            color: #6d1753;
            text-transform: capitalize;
        }

        .navegacion {
            display: flex;
            gap: 8px;
        }

        .apartado {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 999px;
            text-decoration: none;
            color: #78155b;
            font-weight: bold;
            font-size: 15px;
        }

        .apartado:hover {
            color: #B81B88;
        }

        .icono {
            width: 22px;
            height: 22px;
        }

        .sidebar {
            position: fixed;
            top: 80px;
            bottom: 0;
            left: -270px;
            width: 250px;
            padding: 20px;
            box-sizing: border-box;
            background-color: white;
            border-right: 2px solid #E4D9EC;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: left 0.3s;
            z-index: 1001;
        }

        .sidebar.abierta {
            left: 0;
        }

        .sidebar .apartado {
            border: 3px solid transparent;
            border-radius: 14px;
            transition: transform 0.15s, box-shadow 0.2s
        }

        .sidebar .apartado.activo {
            position: relative;
            background-color: #FDF2F9;
            color: #961570;
        }

        .sidebar .apartado:hover {
            background: linear-gradient(white, white) padding-box, linear-gradient(90deg, #D6249F, #B58CFF, #8FE9E5) border-box;
            color: #B81B88;
            transform: scale(1.03);
            box-shadow: 0 6px 18px rgba(214, 36, 159, 0.16);
        }

        body.sidebar-abierta .contenido {
            margin-left: 250px;
            width: calc(100% - 250px);
        }

        .fondoOscuro {
            position: fixed;
            top: 80px;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(40, 20, 35, 0.22);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            z-index: 1000;
        }

        body.sidebar-abierta .fondoOscuro {
            opacity: 1;
            visibility: visible;
        }

        .grupo {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 14px;
        }

        .grupoTitulo {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 6px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            color: #B81B88;
        }

        .grupoTitulo::before {
            content: "";
            width: 3px;
            height: 14px;
            border-radius: 2px;
            background-color: rgb(218, 124, 190);
        }

        .contenido {
            padding: 28px;
            margin-left: 0;
            width: 100%;
            box-sizing: border-box;
            transition: margin-left 0.3s, width 0.3s;
        }

        .datos {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 18px;
            padding: 1% 8%;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .campo > label{
            font-size: 14px;
            font-weight: bold;
            color: #78155b;
        }

        .filaDoble {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .filaTriple {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }
        .fieldLarge,
        .fieldSmall,
        .fieldSelect {
            width: 100%;
            height: 46px;
            padding: 0 16px;
            box-sizing: border-box;
            border: 3px solid transparent;
            border-radius: 14px;
            background: linear-gradient(white, white) padding-box,
            linear-gradient(#E4D9EC, #E4D9EC) border-box;
            font-family: inherit;
            font-size: 15px;
            color: #78155b;
            transition: box-shadow 0.2s;
        }

        .fieldSmall,
        .fieldSelect {
            flex: 1;
            font-size: 14px;
        }

        .fieldLarge::placeholder,
        .fieldSmall::placeholder {
            color: #b996ab;
        }

        .fieldLarge:hover,
        .fieldSmall:hover,
        .fieldSelect:hover,
        .fieldLarge:focus,
        .fieldSmall:focus,
        .fieldSelect:focus {
            outline: none;
            background: linear-gradient(white, white) padding-box,
            linear-gradient(90deg, #D6249F, #B58CFF, #8FE9E5) border-box;
        }

        .fieldLarge:focus,
        .fieldSmall:focus,
        .fieldSelect:focus {
            box-shadow: 0 0 0 4px rgba(214, 36, 159, 0.10), 0 8px 20px rgba(214, 36, 159, 0.16);
        }

        .fieldLarge:disabled,
        .fieldSmall:disabled,
        .fieldSelect:disabled {
            background: linear-gradient(#F5F0F8, #F5F0F8) padding-box,
            linear-gradient(#E4D9EC, #E4D9EC) border-box;
            color: #b996ab;
            cursor: not-allowed;
        }

        .btnAgregar,
        .btnRegistrar {
            --relleno: #D6249F;
            --relleno-h: #B81B88;
            --borde: #D6249F;
            --texto: white;
            --anillo: linear-gradient(90deg, #F5A3D6, #B58CFF, #8FE9E5);
            border: 3px solid transparent;
            background: linear-gradient(var(--relleno), var(--relleno)) padding-box,
            linear-gradient(var(--borde), var(--borde)) border-box;
            color: var(--texto);
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .btnAgregar:not(:disabled):hover,
        .btnRegistrar:not(:disabled):hover,
        .btnAgregar:focus-visible,
        .btn-registrar:focus-visible {
            outline: none;
            background: linear-gradient(var(--relleno-h), var(--relleno-h)) padding-box,
            var(--anillo) border-box;
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(214, 36, 159, 0.22);
        }

        .btnAgregar:disabled,
        .btn-registrar:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btnAgregar {
            height: 44px;
            border-radius: 25px;
            font-size: 18px;
            margin-left: 20%;
            margin-right: 20%;
        }

        .btnRegistrar {
            --relleno: #22D3D0;
            --relleno-h: #14BDBA;
            --borde: #22D3D0;
            --texto: #2A1B3D;
            --anillo: linear-gradient(90deg, #8FE9E5, #B58CFF, #F5A3D6);
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 16px;
        }

        .contenedor {
            background-color: white;
            width: 80%;
            margin: 30px auto;
            border: 2px solid #E4D9EC;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 6px 24px rgba(214, 36, 159, 0.08);
            min-height: 500px;
            box-sizing: border-box;
        }

        .busqueda {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .busq {
            flex-grow: 1;
            padding: 10px 15px 10px 44px;
            border: 3px solid transparent;
            border-radius: 20px;
            font-family: inherit;
            font-size: 16px;
            color: #78155b;
            background: url('resources/buscar.png') no-repeat 14px center / 18px,
            linear-gradient(white, white) padding-box,
            linear-gradient(#E4D9EC, #E4D9EC) border-box;
            outline: none;
            box-sizing: border-box;
            transition: box-shadow 0.2s;
        }

        .busq::placeholder {
            color: #b996ab;
        }

        .busq:hover,
        .busq:focus {
            background: url('resources/buscar.png') no-repeat 14px center / 18px,
            linear-gradient(white, white) padding-box,
            linear-gradient(90deg, #D6249F, #B58CFF, #8FE9E5) border-box;
        }

        .busq:focus {
            box-shadow: 0 0 0 4px rgba(214, 36, 159, 0.10), 0 8px 20px rgba(214, 36, 159, 0.16);
        }

        .box-modificar {
            background-color: #FDF2F9;
            padding: 20px;
            border-radius: 14px;
            border: 2px solid #F5A3D6;
            margin-bottom: 20px;
        }

        .box-modificar .acciones {
            margin-top: 16px;
        }

        .tabla {
            width: 100%;
            border-collapse: collapse;
            background-color: rgba(255,255,255,0.82);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.08);
        }

        .tabla th {
            text-align: center;
            padding: 12px;
            font-size: 16px;
            color: #6d1753;
            background: #f0b8da;
            font-weight: bold;
            border: none;
        }

        .tabla td {
            text-align: center;
            padding: 12px;
            border-left: none;
            border-right: none;
            border-top: none;
            border-bottom: 1px solid #fceff5;
            color: #78155b;
            font-size: 16px;
        }

        .tabla tbody tr:hover {
            background-color: #fff5fb;
        }

        .acciones {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-icono {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: transform 0.15s;
        }

        .btn-icono:hover {
            transform: scale(1.15);
        }

        .btn-icono:focus-visible {
            outline: 3px solid #F5A3D6;
            outline-offset: 3px;
            border-radius: 6px;
        }

        .btn-icono img {
            width: 24px;
            height: 24px;
        }

        .campo .fieldSmall,
        .campo .fieldSelect,
        .campo .fieldLarge {
            height: 46px;
            min-height: 46px;
            width: 100%;
            box-sizing: border-box;
        }

        .opcion {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 16px;
            border: 3px solid transparent;
            font-size: 15px;
            color: #78155b;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            border-bottom-color: #e4d9ec98;
        }

        .opcion:hover,
        .opcion:has(:focus-visible) {
            border: 3px solid transparent;
            background: linear-gradient(white, white) padding-box, linear-gradient(90deg, #D6249F, #B58CFF, #8FE9E5) border-box;
            box-shadow: 0 6px 18px rgba(214, 36, 159, 0.16);
            border-bottom-color: transparent;
            border-radius: 14px;
        }

        .opcionTexto {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .opcionTexto small {
            font-size: 13px;
            color: #6d1753;
            font-weight: normal;
        }

        .fieldCheckbox,
        .fieldRadio {
            appearance: none;
            -webkit-appearance: none;
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            margin: 0;
            border: 3px solid #E4D9EC;
            background: white;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: border-color 0.2s, background 0.2s,box-shadow 0.2s;
        }

        .fieldCheckbox {
            border-radius: 7px;
        }

        .fieldRadio {
            border-radius: 50%;
        }

        .fieldCheckbox:hover,
        .fieldRadio:hover {
            border-color: #D6249F;
        }

        .fieldCheckbox:checked,
        .fieldRadio:checked {
            border-color: #D6249F;
        }

        .fieldCheckbox:checked {
            background: #D6249F;
        }

        .fieldCheckbox:checked::before {
            content: "";
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg) translate(-1px, -1px);
        }

        .fieldRadio:checked::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #D6249F;
        }

        .fieldCheckbox:focus-visible,
        .fieldRadio:focus-visible,
        .fieldSwitch:focus-visible {
            outline: 3px solid #F5A3D6;
            outline-offset: 3px;
        }

        .fieldSwitch {
            appearance: none;
            -webkit-appearance: none;
            position: relative;
            flex-shrink: 0;
            width: 48px;
            height: 28px;
            margin: 0;
            border: 2px solid #E4D9EC;
            border-radius: 999px;
            background: #D9CFE3;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .fieldSwitch::before {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.20);
            transition: transform 0.2s;
        }

        .fieldSwitch:checked {
            background: #D6249F;
            border-color: #D6249F;
        }

        .fieldSwitch:checked::before {
            transform: translateX(20px);
        }

        .fieldCheckbox:disabled,
        .fieldRadio:disabled,
        .fieldSwitch:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .opcion:has(input:disabled) {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .fondoFormulario {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.60);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            box-sizing: border-box;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .fondoFormulario.abierto {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .fondoFormulario .contenedor {
            width: 80%;
            max-width: 950px;
            max-height: 90vh;
            min-height: auto;
            margin: 0;
            overflow-y: auto;
            box-sizing: border-box;
            transform: translateY(10px);
            transition: transform 0.3s;
        }

        .fondoFormulario.abierto .contenedor {
            transform: translateY(0);
        }

        .fondoFormulario .datos {
            padding: 1% 4%;
        }

        @media (max-width: 600px) {
            .fondoFormulario {
                padding: 12px;
            }

            .fondoFormulario .contenedor {
                width: 100%;
                padding: 18px;
            }

            .fondoFormulario .filaDoble,.fondoFormulario .filaTriple {
                grid-template-columns: 1fr;
            }

            .fondoFormulario .btnAgregar {
                margin-left: 0;
                margin-right: 0;
            }
        }

        .opciones {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /*todo esto es para la vista de celular de la pagina */
        @media (max-width: 768px) {
            header {
                height: auto;
                min-height: 70px;
                padding: 12px 16px;
                gap: 12px;
                flex-wrap: wrap;
            }

            .parteIzquierda {
                gap: 10px;
                font-size: 18px;
            }

            .titulo {
                font-size: 19px
            }

            .subtitulo {
                font-size: 12px;
            }

            .navegacion {
                display: none;
            }

            .parteDerecha {
                gap: 10px;
            }

            .usuario {
                gap: 6px;
                font-size: 12px;
            }

            .avatar {
                width: 32px;
                height: 32px;
                font-size: 12px;
            }

            .reloj {
                display: none;
            }

            .contenido {
                padding: 12px;
            }

            .contenedor {
                width: 100%;
                margin: 10px auto;
                padding: 18px;
                border-radius: 14px;
                min-height: auto;
            }

            .datos {
                padding: 0;
                gap: 14px;
            }

            .filaDoble,
            .filaTriple {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .btnAgregar {
                width: 100%;
                margin-left: 0;
                margin-right: 0;
                font-size: 16px;
            }

            .btnRegistrar {
                max-width: 100%;
            }

            .busqueda {
                flex-wrap: wrap;
                align-items: stretch;
            }

            .busq {
                width: 100%;
                min-width: 0;
            }

            .sidebar {
                top: 0;
                bottom: 0;
                left: -85vw;
                width: 85vw;
                max-width: 280px;
                padding: 20px 14px;
                z-index: 1001;
            }

            .sidebar.abierta {
                left: 0;
            }

            body.sidebar-abierta .contenido {
                margin-left: 0;
                width: 100%;
            }

            .fondoFormulario {
                padding: 12px;
            }

            .fondoFormulario .contenedor {
                width: 100%;
                max-height: 90vh;
                padding: 18px;
            }

            .fondoFormulario .datos {
                padding: 0;
            }

            .tabla {
                min-width: 550px;
            }
        }
    </style>
    <script>
        function actualizarReloj() {
            var ahora = new Date();
            document.getElementById('hora').textContent =
                ahora.toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' });
            document.getElementById('fecha').textContent =
                ahora.toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' });
        }

        actualizarReloj();
        setInterval(actualizarReloj, 30000);

        function alternarSidebar() {
            document.getElementById('sidebar').classList.toggle('abierta');
            document.body.classList.toggle('sidebar-abierta');
        }

        function cerrarSidebar() {
            document.getElementById('sidebar').classList.remove('abierta');
            document.body.classList.remove('sidebar-abierta');
        }

        function abrirFormulario(nombre) {
            document.getElementById(nombre).hidden = false;
            document.getElementById('fondoFormulario').classList.add('abierto');
        }

        function cerrarFormulario() {
            document.getElementById('fondoFormulario').classList.remove('abierto');
        }
    </script>
</h:head>
<h:body>
    <header>
        <div class="parteIzquierda">
            <button class="btnSidebar" onclick="alternarSidebar()" aria-label="Abrir menú">☰</button>
            <div class="textos">
                <div class="titulo">YedelApp</div>
                <div class="subtitulo"> <ui:insert name="subtitulo"> Subtitulo </ui:insert> </div>
            </div>

            <nav class="navegacion">
                <a href="#" class="apartado">
                    <p:graphicImage url="resources/salir.png" class="icono"/>
                    <span>Gestión de citas</span>
                </a>

                <a href="#" class="apartado">
                    <p:graphicImage url="resources/salir.png" class="icono"/>
                    <span>Inventario</span>
                </a>
            </nav>
        </div>

        <div class="parteDerecha">
            <div class="usuario">
                <div class="avatar">AD</div>
                <span>Administrador</span>
            </div>

            <div class="reloj">
                <div class="hora" id="hora"></div>
                <div class="fecha" id="fecha"></div>
            </div>
        </div>
    </header>

    <div class="sidebar" id="sidebar">
        <a href="#" class="apartado activo">Inicio</a>
        <a href="#" class="apartado">Gestión de citas</a>
        <a href="#" class="apartado">Inventario</a>
    </div>

    <div class="fondoOscuro" id="fondoOscuro" onclick="cerrarSidebar()"> </div>

    <main class="contenido" id="contenido">
        <ui:insert name="contenido">

        </ui:insert>
    </main>

</h:body>
</html>
